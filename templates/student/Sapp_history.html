<!DOCTYPE html>
<html lang="en">

<head>
    <title>Student Application History</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>

<body>
    <div id="main" class="container">
        <div class="canvas6 p-4">
            <div class="pb-3">
                <div class="d-flex g ">
                    <h3>Student Application History</h3><br>
                    <div class="ms-auto">
                        <a class="btn btn-primary" href="/student/{{student.id}}" role="button">Back</a>
                    </div>
                </div>
                <p class="pt-3">Student Name: {{student.name}}</p>
                <p>Department: {{student.department}}</p>
            </div>

            <table class="table table-striped table-bordered">
                    <thead class=" text-center">
                        <tr class="table-primary">
                            <th>Drive No.</th>
                            <th>Interview</th>
                            <th>Job Title</th>
                            <th>Results</th>
                            <th>Remarks</th>
                        </tr>
                    </thead>
                    <tbody class=" text-center table-group-divider">
                    {%for a in applications%}        
                        <tr>
                                <td>{{loop.index}}</td>
                                <td>{{a.interview}}</td>
                                <td>{{a.drive.title}}</td>
                                <td>{{a.status}}</td>
                                <td>{{a.remarks}}</td>
                            </tr>
                    {%endfor%}
                    </tbody>
                </table>

        </div>
    </div>
</body>

</html>
