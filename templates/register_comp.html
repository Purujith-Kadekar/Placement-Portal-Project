<!DOCTYPE html>
<html lang="en">

<head>
    <title>Company Register Form</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>

<body>
    <div id="main" class="mb-2">
        <div >
            <div id="form3" class="container p-5" >
                <h1>Register Form</h1>
                    <form action="/register/company" method="POST" enctype="multipart/form-data">
                        <div class="mb-3 mt-3">
                            <label for="exampleInputName" class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="exampleInputName" name="company_name">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputContact" class="form-label">HR Contact</label>
                            <input type="tel" class="form-control" id="exampleInputContact" name="hr_contact">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputWebsite" class="form-label">Company Website</label>
                            <input type="url" class="form-control" id="exampleInputWebsite" name="website">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="exampleInputEmail1" name="email"
                                aria-describedby="emailHelp">
                        </div>
                        <div class="mb-3">
                        <label for="text-area" class="form-label">Overview of Company</label>
                        <textarea class="form-control" id="text-area" rows="3" name="overview"></textarea>
                    </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Password</label>
                            <input type="password" class="form-control" id="exampleInputPassword1" name="pass">
                        </div>
                    <div class="mb-3">
                        <label for="formFileLogo" class="form-label">Company Logo (.jpg, .jpeg, .png only) Size: 100x100 pixels</label>
                        <input class="form-control form-control-sm" id="formFileLogo" type="file" name="logo" accept=".jpg,.jpeg,.png">
                    </div>
                        <div style="text-align: center;"><button type="submit" class="btn btn-primary">Register</button></div>
                        {% if error %}
                            <br><div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            {% for message in messages %}
                                <br>
                                <div class="alert alert-danger">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    </form>
                    <div>
                        <div style="text-align: center;">Already have an account? <a href="/login">Login</a></div>
                    </div>
            </div>
        </div>
    </div>
</body>

</html>
