<!DOCTYPE html>
<html lang="en">

<head>
    <title>Company Update Form</title>
</head>

<link rel="stylesheet" href="/static/styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

<body>
    <div id="main">
        <div>
            <div id="form3" class="container p-5 ">
                <h1>Update Form</h1>
                <div>
                    <form method="post" enctype="multipart/form-data">
                        <div class="mb-3 mt-3">
                            <label for="exampleInputName" class="form-label">Company Name</label>
                            <input type="text" class="form-control" id="exampleInputName" name="name"
                                value="{{company.name}}">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputContact" class="form-label">HR Contact</label>
                            <input type="tel" class="form-control" id="exampleInputContact" name="contact"
                                value="{{company.contact}}">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputWebsite" class="form-label">Company Website</label>
                            <input type="url" class="form-control" id="exampleInputWebsite" name="website" value="{{company.website}}">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="exampleInputEmail1" name="email"
                                value="{{company.email}}" aria-describedby="emailHelp">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputOverview" class="form-label">Overview</label>
                            <textarea class="form-control" id="exampleInputOverview" name="overview" rows="3">{{company.overview}}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Password</label>
                            <input type="password" class="form-control" id="exampleInputPassword1" name="pass"
                                placeholder="Leave blank to keep current password">
                        </div>
                        <div class="mb-3">
                            <label for="formFileSm" class="form-label">Company Logo (.jpg, .jpeg, .png only) Size: 100x100 px</label>
                            <input class="form-control form-control-sm" id="formFileSm" type="file" name="logo"
                                accept=".jpg,.jpeg,.png">
                        </div>
                        {% with messages = get_flashed_messages() %}
                        {% if messages %}
                        {% for message in messages %}
                        <br>
                        <div class="alert alert-danger">{{ message }}</div>
                        {% endfor %}
                        {% endif %}
                        {% endwith %}
                        <div style="text-align: center;"><button type="submit" class="btn btn-primary">Save</button>
                            <a href="/company/{{ company.id }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
