<!DOCTYPE html>
<html lang="en">

<head>
    <title>Student Application</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>

<body>
    <div id="main" class="container">
        <div class="canvas p-5">
            <div class="pb-3">
                <h3>Student Application</h3><br>
                <div class="student-head">
                    <div class="student-info">
                        <p class="mb-1">Student Name: {{student_name}}</p>
                        <p class="mb-1">Department: {{student.department}}</p>
                    </div>
                    <img src="/static/student-pfp/{{student.pfp}}" alt="Student PFP" class="student-photo">
                </div>
                <p class="mb-1">Drive: {% if applications %}{{applications[0].drive.name}}{% else %}N/A{% endif %}</p>
                <p>Job Title: {% if applications %}{{applications[0].drive.title}}{% else %}N/A{% endif %}</p>
            </div>
            <div style="text-align: center;"><a class="btn btn-primary" href="/static/resumes/{{student.resume}}" role="button">View Resume</a>
                <a class="btn btn-primary" href="/admin#sapp" role="button">Go Back</a></div>
        </div>
    </div>
</body>

</html>
