<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login Form</title>
</head>

<link rel="stylesheet" href="/static/styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

<body>
    <div id="main">
        <div>
            <div id="form" class="container p-5 ">
                <h1>Login Form</h1>
                    <form action="/login" method="post">
                        {% if success %}
                            <br><div class="alert alert-success">{{ success }}</div>
                        {% endif %}
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="exampleInputEmail1"
                                aria-describedby="emailHelp" name="email">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Password</label>
                            <input type="password" class="form-control" id="exampleInputPassword1" name="pass">
                        </div>
                        <div style="text-align: center;"><button type="submit" class="btn btn-primary">Login</button></div>
                        {% if error %}
                            <br><div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                    </form>
                    <div>
                        <p><div style="text-align: center;">Do not have an account? <a href="/register">Register</a></div>
                    </div>
            </div>
        </div>
    </div>
</body>

</html>
