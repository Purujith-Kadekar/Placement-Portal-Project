<!DOCTYPE html>
<html lang="en">

<head>
    <title>Students' Drive</title>
</head>
<link rel="stylesheet" href="/static/styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

<body>
    <div id="main" class="container">
        <div class="canvas">
            <div class="p-5">
                <h2>{{drive.name}}</h2>
                <div class="company-head ">
                    <div class="student-info">
                        <p class="mb-0">Company Name: </p>
                        <p class="mb-3">{{drive.company.name}}</p>
                        <p class="mb-0">Job Title: </p>
                        <p class="mb-3">{{drive.title}}</p>
                        <p class="mb-0">Job Description: </p>
                        <p class="mb-3">{{drive.description}}</p>
                    </div>
                    <img src="/static/comp-logo/{{drive.company.logo}}" alt="Company Logo" class="company-logo">
                </div>
                <p>Salary: {{drive.salary}}</p>
                <p>Location: {{drive.location}}</p>
                <div style="text-align: center;"><a class="btn btn-primary" href="/student/{{student_id}}"role="button">Go Back</a></div>
            </div>

        </div>
    </div>
</body>

</html>
