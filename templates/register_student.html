<!DOCTYPE html>
<html lang="en">

<head>
    <title>Student Register Form</title>
</head>

<link rel="stylesheet" href="/static/styles.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

<body>
    <div id="main" class="mb-2">
        <div>
            <div id="form2" class="container p-5 ">
                <h1>Register Form</h1>
                <form method="post" enctype="multipart/form-data">
                    <div class="mb-3 mt-3">
                        <label for="exampleInputName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="exampleInputName" name="name"
                            value="{{ request.form.get('name', '') }}" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputDepartment" class="form-label">Department</label>
                        <input type="text" class="form-control" id="exampleInputDepartment" name="department" value="{{ request.form.get('department', '') }}">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputCGPA" class="form-label">CGPA</label>
                        <input type="number" class="form-control" id="exampleInputCGPA" name="cgpa" step="0.01" min="4"
                            max="10" value="{{ request.form.get('cgpa', '') }}">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" name="email"
                            value="{{ request.form.get('email', '') }}" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Password</label>
                        <input type="password" class="form-control" id="exampleInputPassword1" name="pass" value="{{ request.form.get('pass', '') }}">
                    </div>
                    <div class="mb-3">
                        <label for="formFilePfp" class="form-label">Profile Picture (.jpg, .jpeg, .png only)</label>
                        <input class="form-control form-control-sm" id="formFilePfp" type="file" name="pfp" accept=".jpg,.jpeg,.png">
                    </div>
                    <div class="mb-3">
                        <label for="formFileResume" class="form-label">Resume (.pdf only)</label>
                        <input class="form-control form-control-sm" id="formFileResume" type="file" name="resume" accept=".pdf">
                    </div>
                    <div style="text-align: center;"><button type="submit" class="btn btn-primary">Register</button></div>
                    {% if error %}
                            <br><div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                    {% if request.method == 'POST' %}
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for message in messages %}
                                    <br>
                                    <div class="alert alert-danger">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                    {% endif %}
                </form>
                <div>
                    <p>
                        <div style="text-align: center;">Already have an account? <a href="/login">Login</a></div>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
