<!DOCTYPE html>
<html lang="en">

<head>
    <title>Drive Application</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>

<body>
    <div id="main" class="container">
        <div class="canvas3 p-4">
            <h3>Update Applications for the Drive</h3><br>
            Job Title: {{drive.title}}<br><br>
            <div class="pb-3 pt-2">
                <div class="pb-1">
                    <h5>Received Applications :</h5>
                </div>
                {% for application in applications %}
                <div class="app-row">
                    <div class="drive d-flex gap-2 align-items-center p-1">
                        <div class="mx-2">
                            {{application.student.name}}<br>
                        </div>
                        <div class="ms-auto px-4">
                            <a class="btn btn-primary" href="/company/{{company_id}}/sapp_details/{{application.id}}"
                                role="button">Review application</a>
                        </div>
                    </div>
                </div>
                {% else %}
                <div class="mx-2" style="color: rgb(163, 162, 162);">No applications received yet</div>
                {% endfor %}
            </div>
            <div class="position-absolute bottom-0 end-0 p-4">
                <a class="btn btn-primary" href="/company/{{ company_id }}" role="button">Go Back</a>
            </div>
        </div>
    </div>
</body>

</html>
